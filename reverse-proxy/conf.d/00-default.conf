# Sin esto, nginx usa el PRIMER server block que encuentre como fallback
# para cualquier Host que no matchee ninguno de los definidos (ej: alguien
# pegándole a la IP pelada) — y ese primero terminaría sirviendo el sitio de
# un proyecto sin querer. 444 es un código propio de nginx: cierra la
# conexión sin responder nada.
# El nombre "00-" es a propósito: nginx lee conf.d alfabéticamente y el
# primer server block que define default_server gana; con "00-" nos
# aseguramos de que sea este, sin importar qué otros .conf se agreguen.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
