# Sitio de Acompañada. acompanada-web/acompanada-api son container_name de
# ese repo (docker-compose.prod.yml) — llegan acá por la red `edge`.
#
# Todavía sin server block de :443 a propósito: el certificado no existe
# hasta correr certbot (ver MIGRACION.md, paso "Certificado de Acompañada").
# Agregarlo ahora haría fallar `nginx -t` del archivo entero (certificado
# inexistente) y con eso, cualquier reload — incluido el de taller.

server {
    listen 80;
    listen [::]:80;
    server_name francia.tetraquarklover.space api.francia.tetraquarklover.space;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}
