# Sitio de taller. workshop-frontend/workshop-grafana son container_name de
# ese repo (docker-compose.yml y docker-compose.observability.yml) — llegan
# acá porque se suman a la red `edge` como external, no porque este proxy
# sepa nada de la estructura interna de taller más allá de esos dos nombres.
#
# Certificado migrado de taller/deploy/nginx-edge/ (no re-emitido) — ver
# MIGRACION.md, paso "Copiar el certificado de taller".

server {
    listen 80;
    listen [::]:80;
    server_name admin.tallerlallave.com grafana.tallerlallave.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.tallerlallave.com;

    ssl_certificate     /etc/letsencrypt/live/admin.tallerlallave.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.tallerlallave.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    resolver 127.0.0.11 valid=10s;
    set $upstream_taller_web workshop-frontend:80;

    location / {
        proxy_pass http://$upstream_taller_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name grafana.tallerlallave.com;

    ssl_certificate     /etc/letsencrypt/live/admin.tallerlallave.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.tallerlallave.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    resolver 127.0.0.11 valid=10s;
    set $upstream_taller_grafana workshop-grafana:3000;

    location / {
        proxy_pass http://$upstream_taller_grafana;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
